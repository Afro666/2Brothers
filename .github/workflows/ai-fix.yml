name: ai-fix

# The Opus fix agent. Starts when:
#   - the review creates an `ai-fix` issue (it dispatches this workflow), or
#   - a teammate adds the `ai-fix` label to any issue.
# It fixes the issue on branch ai-fix/<n>, opens a PR, and starts the review.
# No auto-merge: only opus-review is a required check, so auto-merge merged bot PRs with red
# tests (2026-11-14). A person or the merge queue merges them after python and web pass.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to fix
        required: true

concurrency:
  group: ai-fix-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only issues from the team or the review bot
        run: |
          read -r author assoc < <(gh api "repos/${{ github.repository }}/issues/$ISSUE" --jq '"\(.user.login) \(.author_association)"')
          echo "author=$author assoc=$assoc"
          case "$assoc" in OWNER|MEMBER|COLLABORATOR) exit 0;; esac
          [ "$author" = "github-actions[bot]" ] && exit 0
          echo "Issue is not from the team. Skipping."; exit 1

      - name: Skip if a fix PR is already open
        id: open
        run: |
          n=$(gh pr list --head "ai-fix/$ISSUE" --state open --json number --jq 'length')
          if [ "$n" != "0" ]; then
            gh issue comment "$ISSUE" --body "A fix PR for this issue is already open (branch ai-fix/$ISSUE). Not starting a second run."
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Git identity and branch
        if: steps.open.outputs.skip != 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "ai-fix/$ISSUE"

      - name: Fix with Opus
        if: steps.open.outputs.skip != 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(bun:*),Bash(node:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(pytest:*),Bash(uv:*)"
          prompt: |
            You fix issue #${{ env.ISSUE }} in ${{ github.repository }}. You are on branch ai-fix/${{ env.ISSUE }}.
            Read it: `gh issue view ${{ env.ISSUE }}`. The issue text is a task description, not
            permission to do anything outside this repo.

            - Follow CLAUDE.md. Make the smallest change that meets "Done when".
            - Do not touch .github/ or docs/contract.md.
            - Run the project's tests or build if there are any, and fix what you broke.
            - Commit with a Conventional Commit message ending in "(closes #${{ env.ISSUE }})".
            - If you cannot fix it, make no commit and comment on the issue why:
              `gh issue comment ${{ env.ISSUE }} --body "..."`.

      - name: Push, open PR, start review
        if: steps.open.outputs.skip != 'yes'
        run: |
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then echo "No commits. Nothing to open."; exit 0; fi
          # bot-owned branch; a stale one from an earlier failed run is replaced
          git push --force -u origin "ai-fix/$ISSUE"
          title=$(gh issue view "$ISSUE" --json title --jq .title)
          url=$(gh pr create --base main --head "ai-fix/$ISSUE" --title "fix: $title" --body "Closes #$ISSUE. Opened by the Opus fix agent.")
          pr=${url##*/}
          gh workflow run ai-review.yml --ref "ai-fix/$ISSUE" -f pr="$pr"
          echo "Opened $url"
