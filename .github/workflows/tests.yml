name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,signals]" pytest
      - name: Run tests (no live calls; no secrets in this job)
        run: python -m pytest -q -p no:cacheprovider --ignore=web --ignore=vendor

  gateway-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the gateway image
        run: docker build -f gateway/Dockerfile -t gateway-test .
      - name: Read public recall and verification evidence in the runtime image
        run: >-
          docker run --rm --workdir /tmp gateway-test python -c
          "from monitor.labels import recording; from monitor.enrichment import evidence;
          from monitor.proposals import apply_notices;
          assert recording()['complete'] is True;
          assert evidence()['product_id'] == '475842'"
      - name: Start it and check /health (no keys needed for /health)
        run: |
          docker run -d --name gw -p 8000:8000 gateway-test
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs gw; exit 1

  # The web app's own checks; without this job a broken web test did not block a merge.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --testTimeout=30000
      - run: npm run build
