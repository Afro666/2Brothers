name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,signals]" pytest
      - name: Run tests (no live calls; no secrets in this job)
        run: python -m pytest -q -p no:cacheprovider --ignore=web --ignore=vendor

  gateway-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the gateway image
        run: docker build -f gateway/Dockerfile -t gateway-test .
      - name: Start it and check /health (no keys needed for /health)
        run: |
          docker run -d --name gw -p 8000:8000 gateway-test
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs gw; exit 1
