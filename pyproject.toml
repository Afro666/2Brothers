[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "two-brothers"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["tzdata>=2025.2", "httpx>=0.28,<1", "mcp>=1.26,<2", "jsonschema>=4.23,<5", "python-dotenv>=1,<2", "pymongo>=4.10,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pyjwt[crypto]>=2.10,<3"]

[project.optional-dependencies]
test = ["mongomock>=4.1,<5", "httpx>=0.28,<1"]
signals = ["holidays>=0.107,<1"]
covers = ["numpy>=1.24,<3", "statsmodels>=0.14,<0.15", "holidays>=0.107,<1"]

[project.scripts]
two-brothers-mcp = "gateway.mcp_server:main"
two-brothers-gateway = "gateway.app:main"
two-brothers-agent = "agent.__main__:main"
two-brothers-buyer-worker = "agent.service:main"

[tool.setuptools.package-data]
store = ["*.json"]
signals = ["*.json"]
monitor = ["fixtures/*.json"]
agent = ["fixtures/*.json", "fixtures/receiving/*.json", "fixtures/receiving/*.png", "fixtures/shelf/*.json", "fixtures/shelf/*.png"]

[tool.setuptools.packages.find]
include = ["gateway*", "engine*", "agent*", "store*", "signals*", "monitor*"]
exclude = ["*.tests*"]
