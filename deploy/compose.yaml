name: two-brothers

# Values come from the server's /opt/2brothers/.env (see deploy/README.md).
# A missing required value stops the deploy instead of starting something open.

services:
  web:
    build:
      context: ../web
      args:
        VITE_LIVE_BUYER: "true"
        # Proposals, approvals, orders and the audit log come from the gateway behind /api;
        # the screens it does not serve yet stay on the mock, marked "Sample data".
        VITE_GATEWAY_URL: /api
        VITE_USE_MOCKS: "false"
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
      # Caddy serves HTTP/3 over UDP.
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      GATEWAY_HUMAN_TOKEN: ${GATEWAY_HUMAN_TOKEN:?set GATEWAY_HUMAN_TOKEN in .env}
    volumes:
      # Caddy keeps its HTTPS certificates here; losing it re-requests them.
      - caddy_data:/data
      # Caddy's autosaved config; the image documents it as a volume too.
      - caddy_config:/config

  # Reached only through the web container (no published port).
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      VALIO_API_KEY: ${VALIO_API_KEY:?set VALIO_API_KEY in .env}
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      GATEWAY_AGENT_TOKEN: ${GATEWAY_AGENT_TOKEN:?set GATEWAY_AGENT_TOKEN in .env}
      GATEWAY_HUMAN_TOKEN: ${GATEWAY_HUMAN_TOKEN:?set GATEWAY_HUMAN_TOKEN in .env}
      GATEWAY_KITCHEN_ID: ${GATEWAY_KITCHEN_ID:-demo-kitchen}
      BUYER_WORKER_URL: http://buyer:8001
      # Optional, for one-off runs only: `docker compose run gateway python -m agent.seller` (Valio's
      # selling agent, #374) asks Nemotron to pick a substitute. The gateway server never calls the model.
      VERDA_INFERENCE_KEY: ${VERDA_INFERENCE_KEY:-}
      NEMOTRON_BASE_URL: ${NEMOTRON_BASE_URL:-}
      NEMOTRON_MODEL: ${NEMOTRON_MODEL:-}
      # Optional: the onboarding lookup (#375); without it that one route answers 502. Also the live
      # scrape of "Check recalls now" (#358); without it the check uses the recording and says so.
      CONTEXT_DEV_API_KEY: ${CONTEXT_DEV_API_KEY:-}
      # Sign-in (#270). Default: the open demo (anyone with the link is the demo person).
      # GATEWAY_REQUIRE_LOGIN=true switches the shared demo session off: people sign in at /sign-in.
      # DEMO_USER_EMAIL / DEMO_USER_PASSWORD create the first approver at the first sign-in
      # (single-quote a password that has a $ in it). More accounts: python -m gateway.users add.
      GATEWAY_REQUIRE_LOGIN: ${GATEWAY_REQUIRE_LOGIN:-false}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      # Optional: the key that signs offers (#290), base64 of 32 bytes. Without it a key is
      # created once and kept in the database.
      GATEWAY_SIGNING_KEY: ${GATEWAY_SIGNING_KEY:-}
      # Hybrid catalog search (#366): text plus meaning. Off unless SEARCH_HYBRID=true. The query
      # is embedded with MONGODB_AI_API_KEY (free tier: 3 requests a minute); on any error, limit
      # or missing key the search falls back to text and says so. Off again: SEARCH_HYBRID=false.
      SEARCH_HYBRID: ${SEARCH_HYBRID:-false}
      MONGODB_AI_API_KEY: ${MONGODB_AI_API_KEY:-}
      # Caddy strips this prefix (web/Caddyfile); the agent card and llms.txt print it in their URLs (#293).
      GATEWAY_PUBLIC_PREFIX: /gateway

  # Internal worker: no human token, upstream Valio key or published port.
  buyer:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    command: ["two-brothers-buyer-worker"]
    restart: unless-stopped
    environment:
      # Optional: without it only this worker fails (503 BUYER_UNAVAILABLE), not the deploy.
      VERDA_INFERENCE_KEY: ${VERDA_INFERENCE_KEY:-}
      NEMOTRON_BASE_URL: ${NEMOTRON_BASE_URL:-}
      NEMOTRON_MODEL: ${NEMOTRON_MODEL:-}
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      GATEWAY_AGENT_TOKEN: ${GATEWAY_AGENT_TOKEN:?set GATEWAY_AGENT_TOKEN in .env}
      GATEWAY_KITCHEN_ID: ${GATEWAY_KITCHEN_ID:-demo-kitchen}
      GATEWAY_BASE_URL: http://gateway:8000

volumes:
  caddy_data:
  caddy_config:
