name: two-brothers

# Values come from the server's /opt/2brothers/.env (see deploy/README.md).
# A missing required value stops the deploy instead of starting something open.

services:
  web:
    build:
      context: ../web
      args:
        VITE_LIVE_BUYER: "true"
        # Proposals, approvals, orders and the audit log come from the gateway behind /api;
        # the screens it does not serve yet stay on the mock, marked "Sample data".
        VITE_GATEWAY_URL: /api
        VITE_USE_MOCKS: "false"
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      GATEWAY_HUMAN_TOKEN: ${GATEWAY_HUMAN_TOKEN:?set GATEWAY_HUMAN_TOKEN in .env}
    volumes:
      # Caddy keeps its HTTPS certificates here; losing it re-requests them.
      - caddy_data:/data

  # Reached only through the web container (no published port).
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      VALIO_API_KEY: ${VALIO_API_KEY:?set VALIO_API_KEY in .env}
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      GATEWAY_AGENT_TOKEN: ${GATEWAY_AGENT_TOKEN:?set GATEWAY_AGENT_TOKEN in .env}
      GATEWAY_HUMAN_TOKEN: ${GATEWAY_HUMAN_TOKEN:?set GATEWAY_HUMAN_TOKEN in .env}
      GATEWAY_KITCHEN_ID: ${GATEWAY_KITCHEN_ID:-demo-kitchen}
      BUYER_WORKER_URL: http://buyer:8001
      # Caddy strips this prefix (web/Caddyfile); the agent card and llms.txt print it in their URLs (#293).
      GATEWAY_PUBLIC_PREFIX: /gateway

  # Internal worker: no human token, upstream Valio key or published port.
  buyer:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    command: ["two-brothers-buyer-worker"]
    restart: unless-stopped
    environment:
      # Optional: without it only this worker fails (503 BUYER_UNAVAILABLE), not the deploy.
      VERDA_INFERENCE_KEY: ${VERDA_INFERENCE_KEY:-}
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      GATEWAY_AGENT_TOKEN: ${GATEWAY_AGENT_TOKEN:?set GATEWAY_AGENT_TOKEN in .env}
      GATEWAY_KITCHEN_ID: ${GATEWAY_KITCHEN_ID:-demo-kitchen}
      GATEWAY_BASE_URL: http://gateway:8000

volumes:
  caddy_data:
