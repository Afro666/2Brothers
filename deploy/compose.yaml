name: two-brothers

services:
  web:
    build: ../web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      # Caddy keeps its HTTPS certificates here; losing it re-requests them.
      - caddy_data:/data

volumes:
  caddy_data:
